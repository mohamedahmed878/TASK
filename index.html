<style>
  :root{
    --bg-deep:#0F1216;
    --bg-vignette:#171B21;
    --surface:#1C2129;
    --surface-hi:#242B35;
    --stroke:#323A46;
    --ink:#EFEAE0;
    --ink-soft:#8D95A3;
    --lamp:#F2A65A;
    --lamp-soft:#F7C98A;
    --violet:#8B9CFF;
    --done:#6FCF97;
    --danger:#E9705C;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg-deep);
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:calc(40px + var(--safe-top)) 16px calc(100px + var(--safe-bottom));
    overflow-x:hidden;
    position:relative;
  }

  .ambient{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ambient span{
    position:absolute; bottom:-40px; width:5px; height:5px; border-radius:50%;
    background:var(--lamp-soft); opacity:0; filter:blur(0.3px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    8%{ opacity:.55; } 92%{ opacity:.35; }
    100%{ transform:translateY(-115vh) translateX(var(--dx,20px)); opacity:0; }
  }

  .glow{
    position:fixed; top:-10%; right:50%; transform:translateX(50%);
    width:900px; height:700px;
    background:radial-gradient(circle, rgba(242,166,90,0.16), rgba(242,166,90,0) 65%);
    z-index:0; animation:breathe 6s ease-in-out infinite; pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:.7; transform:translateX(50%) scale(1); }
    50%{ opacity:1; transform:translateX(50%) scale(1.08); }
  }

  .page{
    width:100%; max-width:620px; background:var(--surface); border-radius:18px;
    box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 30px 60px -25px rgba(0,0,0,0.65), 0 0 0 1px var(--stroke);
    position:relative; overflow:hidden; z-index:1;
    opacity:0; transform:translateY(22px) scale(.985);
    animation:cardIn .7s cubic-bezier(.16,1,.3,1) .05s forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0) scale(1); } }

  .lamp-bar{
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(to left, transparent, var(--lamp), var(--violet), transparent);
    background-size:200% 100%; animation:sweep 5s linear infinite; opacity:.9;
  }
  @keyframes sweep{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }

  header{ padding:36px 32px 20px; position:relative; z-index:1; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.1em;
    color:var(--lamp); font-weight:700; text-transform:uppercase; margin-bottom:8px;
    opacity:0; animation:fadeUp .5s ease .25s forwards;
  }
  h1{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:36px; margin:0 0 6px; letter-spacing:-0.5px;
    background:linear-gradient(90deg, var(--ink), var(--lamp-soft) 60%, var(--violet));
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:titleShine 6s ease-in-out infinite, fadeUp .5s ease .32s backwards;
  }
  @keyframes titleShine{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .date{ font-size:14px; color:var(--ink-soft); font-weight:500; opacity:0; animation:fadeUp .5s ease .4s forwards; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .progress-row{ display:flex; align-items:center; gap:14px; margin-top:22px; opacity:0; animation:fadeUp .5s ease .48s forwards; }
  .progress-track{ flex:1; height:9px; background:var(--bg-vignette); border:1px solid var(--stroke); border-radius:99px; overflow:hidden; position:relative; }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--done), var(--lamp)); width:0%;
    transition:width .6s cubic-bezier(.4,0,.2,1); border-radius:99px; position:relative; overflow:hidden;
  }
  .progress-fill::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    width:40%; animation:shimmer 1.8s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{ transform:translateX(-150%); } 100%{ transform:translateX(350%); } }
  .progress-count{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--lamp-soft); white-space:nowrap; }

  .add-card{ position:relative; z-index:1; padding:22px 32px 18px; display:flex; flex-direction:column; gap:10px; }
  .add-row{ display:flex; gap:8px; }
  .add-row input[type="text"]{
    flex:1; border:1.5px solid var(--stroke); background:var(--bg-vignette); border-radius:12px;
    padding:14px 16px; font-family:'IBM Plex Sans Arabic',sans-serif; font-size:16px; color:var(--ink);
    outline:none; transition:border-color .25s, box-shadow .25s, background .25s; min-width:0;
  }
  .add-row input::placeholder{ color:#5D6472; }
  .add-row input:focus{ border-color:var(--lamp); box-shadow:0 0 0 4px rgba(242,166,90,0.15); background:var(--surface-hi); }
  .time-row{ display:flex; align-items:center; gap:10px; }
  .time-row label{ font-size:13px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
  .time-row input[type="time"]{
    border:1.5px solid var(--stroke); background:var(--bg-vignette); border-radius:10px;
    padding:9px 12px; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--ink);
    outline:none; color-scheme:dark; flex:1;
  }
  .time-row input[type="time"]:focus{ border-color:var(--lamp); }
  .clear-time{
    background:none; border:1px solid var(--stroke); color:var(--ink-soft); font-size:12px;
    padding:7px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .add-row button{
    position:relative; overflow:hidden; border:none;
    background:linear-gradient(135deg, var(--lamp), #E08A3C); color:#1A1206;
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:15px; padding:0 22px; border-radius:12px;
    cursor:pointer; transition:transform .15s, box-shadow .25s; box-shadow:0 6px 16px -6px rgba(242,166,90,0.6);
    flex:none;
  }
  .add-row button:hover{ transform:translateY(-2px); box-shadow:0 10px 22px -8px rgba(242,166,90,0.75); }
  .add-row button:active{ transform:translateY(0) scale(.96); }
  .ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,0.55); transform:scale(0); animation:rippleAnim .55s ease-out forwards; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform:scale(3); opacity:0; } }

  .filters{ position:relative; z-index:1; display:flex; gap:6px; padding:0 32px 18px; }
  .filters button{
    border:1px solid var(--stroke); background:transparent; color:var(--ink-soft);
    font-family:'IBM Plex Sans Arabic',sans-serif; font-size:12.5px; font-weight:600;
    padding:8px 15px; border-radius:99px; cursor:pointer; transition:all .25s;
  }
  .filters button:hover{ border-color:var(--lamp); color:var(--lamp-soft); }
  .filters button.active{ background:linear-gradient(135deg, var(--lamp), #E08A3C); border-color:transparent; color:#1A1206; }

  ul.list{ list-style:none; margin:0; padding:6px 32px 30px; position:relative; z-index:1; min-height:70px; }
  li.task{
    display:flex; align-items:flex-start; gap:12px; padding:14px 10px; margin:0 -10px 4px;
    border-radius:12px; animation:enter .4s cubic-bezier(.16,1,.3,1) both; transition:background .25s, transform .2s;
  }
  li.task:hover{ background:var(--surface-hi); transform:translateX(-2px); }
  li.task.removing{ animation:leave .3s ease forwards; }
  @keyframes enter{ from{opacity:0; transform:translateY(-8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes leave{ to{ opacity:0; transform:translateX(24px) scale(.96); max-height:0; padding-top:0; padding-bottom:0; margin:0; } }

  .checkbox{
    flex:none; width:28px; height:28px; border-radius:8px; border:2px solid var(--lamp); cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:transparent;
    transition:background .3s, border-color .3s, transform .18s; margin-top:2px; position:relative;
  }
  .checkbox:hover{ transform:scale(1.08); }
  .checkbox:active{ transform:scale(.85); }
  .checkbox.checked{ background:var(--done); border-color:var(--done); animation:pop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.28); } 100%{ transform:scale(1); } }
  .checkbox svg{
    width:16px; height:16px; stroke:#0F1216; stroke-width:3.4; fill:none;
    stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:24; stroke-dashoffset:24;
  }
  .checkbox.checked svg{ animation:tick .32s ease forwards; }
  @keyframes tick{ to{ stroke-dashoffset:0; } }
  .burst{ position:absolute; inset:0; pointer-events:none; }
  .burst span{
    position:absolute; top:50%; left:50%; width:5px; height:5px; border-radius:50%;
    background:var(--lamp-soft); transform:translate(-50%,-50%); animation:fly .55s ease-out forwards;
  }
  @keyframes fly{ to{ transform:translate(calc(-50% + var(--bx)), calc(-50% + var(--by))); opacity:0; } }

  .task-body{ flex:1; min-width:0; }
  .task-text{ font-size:15.5px; font-weight:500; line-height:1.5; word-break:break-word; transition:color .35s; }
  .task-meta{ display:flex; align-items:center; gap:6px; margin-top:5px; }
  .time-badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace;
    font-size:11.5px; font-weight:700; color:var(--lamp-soft); background:rgba(242,166,90,0.12);
    border:1px solid rgba(242,166,90,0.3); padding:3px 9px; border-radius:99px;
  }
  .time-badge.past{ color:var(--ink-soft); background:rgba(141,149,163,0.1); border-color:var(--stroke); }
  li.task.done .task-text{ color:var(--ink-soft); position:relative; }
  li.task.done .task-text::after{
    content:""; position:absolute; right:0; left:0; top:50%; height:2px; background:var(--lamp);
    transform:scaleX(0); transform-origin:right; animation:strike .4s ease forwards;
  }
  @keyframes strike{ to{transform:scaleX(1);} }

  .delete-btn{
    flex:none; background:none; border:none; color:#565E6B; font-size:20px; cursor:pointer;
    padding:4px 8px; line-height:1; transition:color .2s, transform .2s; margin-top:0px; border-radius:6px;
  }
  .delete-btn:hover{ color:var(--danger); transform:rotate(90deg); }

  .empty{ text-align:center; padding:44px 10px; color:var(--ink-soft); font-size:14px; animation:fadeUp .4s ease both; }
  .empty .mark{
    font-family:'Tajawal',sans-serif; font-weight:900; font-size:16px;
    background:linear-gradient(90deg, var(--lamp), var(--violet)); -webkit-background-clip:text; background-clip:text;
    color:transparent; display:block; margin-bottom:8px; animation:sway 2.4s ease-in-out infinite;
  }
  @keyframes sway{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-4px) rotate(-3deg); } }

  footer{ position:relative; z-index:1; padding:16px 32px calc(24px); text-align:center; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--stroke); margin-top:6px; }

  /* Alarm overlay */
  .alarm-overlay{
    position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(6,7,9,0.78); backdrop-filter:blur(6px); padding:20px;
  }
  .alarm-overlay.show{ display:flex; }
  .alarm-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--stroke);
    border-radius:20px; padding:32px 26px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.7);
    animation:alarmIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes alarmIn{ from{ opacity:0; transform:scale(.85) translateY(10px);} to{ opacity:1; transform:scale(1) translateY(0);} }
  .alarm-ring{
    width:72px; height:72px; margin:0 auto 18px; border-radius:50%;
    background:radial-gradient(circle, rgba(242,166,90,0.35), rgba(242,166,90,0) 70%);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .alarm-ring::before, .alarm-ring::after{
    content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--lamp);
    animation:ripple2 1.6s ease-out infinite;
  }
  .alarm-ring::after{ animation-delay:.5s; }
  @keyframes ripple2{ 0%{ transform:scale(.7); opacity:.9; } 100%{ transform:scale(1.9); opacity:0; } }
  .alarm-icon{ font-size:30px; position:relative; z-index:1; animation:bell 1s ease-in-out infinite; }
  @keyframes bell{ 0%,100%{ transform:rotate(0deg); } 20%{ transform:rotate(-18deg); } 40%{ transform:rotate(14deg); } 60%{ transform:rotate(-10deg); } 80%{ transform:rotate(6deg); } }
  .alarm-title{ font-family:'Tajawal',sans-serif; font-weight:900; font-size:20px; color:var(--lamp-soft); margin-bottom:6px; }
  .alarm-task{ font-size:16px; font-weight:600; color:var(--ink); margin-bottom:22px; line-height:1.5; }
  .alarm-actions{ display:flex; gap:10px; }
  .alarm-actions button{
    flex:1; border:none; border-radius:12px; padding:13px; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:14.5px; cursor:pointer; transition:transform .15s;
  }
  .alarm-actions button:active{ transform:scale(.96); }
  .btn-stop{ background:linear-gradient(135deg, var(--lamp), #E08A3C); color:#1A1206; }
  .btn-done{ background:var(--done); color:#0F1216; }

  .toast{
    position:fixed; bottom:calc(20px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-hi); border:1px solid var(--stroke); color:var(--ink); font-size:13px;
    padding:11px 20px; border-radius:99px; z-index:60; opacity:0; transition:all .3s; pointer-events:none;
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    body{ padding:calc(24px + var(--safe-top)) 0 calc(90px + var(--safe-bottom)); align-items:stretch; }
    .page{ border-radius:0; max-width:none; min-height:100vh; min-height:100dvh; }
    header, .add-card, .filters, ul.list, footer{ padding-left:20px; padding-right:20px; }
    h1{ font-size:30px; }
    .checkbox{ width:30px; height:30px; }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="ambient" id="ambient"></div>

  <div class="page">
    <div class="lamp-bar"></div>
    <header>
      <div class="eyebrow">دفتر اليوم</div>
      <h1>مهمّات يومية</h1>
      <div class="date" id="todayDate"></div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-count" id="progressCount">٠ / ٠</div>
      </div>
    </header>

    <div class="add-card">
      <div class="add-row">
        <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." maxlength="120">
        <button id="addBtn">إضافة</button>
      </div>
      <div class="time-row">
        <label for="timeInput">⏰ تذكير الساعة</label>
        <input type="time" id="timeInput">
        <button class="clear-time" id="clearTimeBtn" type="button">بدون وقت</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="active">لم تكتمل</button>
      <button class="filter-btn" data-filter="done">مكتملة</button>
    </div>

    <ul class="list" id="taskList"></ul>

    <footer>كل مهمة تُنجز هي ضوء جديد يُضاء</footer>
  </div>

  <div class="alarm-overlay" id="alarmOverlay">
    <div class="alarm-card">
      <div class="alarm-ring"><div class="alarm-icon">⏰</div></div>
      <div class="alarm-title">حان وقت المهمة</div>
      <div class="alarm-task" id="alarmTaskText"></div>
      <div class="alarm-actions">
        <button class="btn-done" id="alarmDoneBtn">تم الإنجاز</button>
        <button class="btn-stop" id="alarmStopBtn">إيقاف</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let tasks = [];
  let idCounter = 1;
  let filter = 'all';
  let alarmTimer = null;
  let alarmAudioCtx = null;
  let currentAlarmTaskId = null;
  let activeAlarmNodes = [];

  const listEl = document.getElementById('taskList');
  const inputEl = document.getElementById('taskInput');
  const timeEl = document.getElementById('timeInput');
  const clearTimeBtn = document.getElementById('clearTimeBtn');
  const addBtn = document.getElementById('addBtn');
  const progressFill = document.getElementById('progressFill');
  const progressCount = document.getElementById('progressCount');
  const dateEl = document.getElementById('todayDate');
  const ambientEl = document.getElementById('ambient');
  const alarmOverlay = document.getElementById('alarmOverlay');
  const alarmTaskText = document.getElementById('alarmTaskText');
  const alarmStopBtn = document.getElementById('alarmStopBtn');
  const alarmDoneBtn = document.getElementById('alarmDoneBtn');
  const toastEl = document.getElementById('toast');

  const toArabicDigits = (n) => String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

  function setDate(){
    const d = new Date();
    const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    dateEl.textContent = d.toLocaleDateString('ar-EG', opts);
  }

  function spawnAmbient(){
    const count = 14;
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      const left = Math.random()*100;
      const dur = 9 + Math.random()*10;
      const delay = Math.random()*12;
      const dx = (Math.random()*60-30) + 'px';
      s.style.left = left + '%';
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = delay + 's';
      s.style.setProperty('--dx', dx);
      ambientEl.appendChild(s);
    }
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function addTask(text){
    const trimmed = text.trim();
    if(!trimmed) return;
    const time = timeEl.value || null;
    tasks.push({ id: idCounter++, text: trimmed, done:false, time, notifiedFor:null });
    inputEl.value = '';
    timeEl.value = '';
    inputEl.focus();
    render();
  }

  function toggleTask(id, checkboxEl){
    const t = tasks.find(t => t.id === id);
    if(!t) return;
    t.done = !t.done;
    if(t.done && checkboxEl){ burst(checkboxEl); }
    render();
  }

  function burst(checkboxEl){
    const wrap = document.createElement('div');
    wrap.className = 'burst';
    checkboxEl.appendChild(wrap);
    const n = 8;
    for(let i=0;i<n;i++){
      const p = document.createElement('span');
      const angle = (Math.PI*2/n)*i;
      const dist = 22 + Math.random()*10;
      p.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--by', Math.sin(angle)*dist + 'px');
      wrap.appendChild(p);
    }
    setTimeout(() => wrap.remove(), 600);
  }

  function ripple(e, btn){
    const r = document.createElement('span');
    r.className = 'ripple';
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(() => r.remove(), 600);
  }

  function deleteTask(id, liEl){
    liEl.classList.add('removing');
    setTimeout(() => {
      tasks = tasks.filter(t => t.id !== id);
      render();
    }, 280);
  }

  function fmtTimeBadge(hhmm){
    const [h,m] = hhmm.split(':').map(Number);
    const period = h < 12 ? 'ص' : 'م';
    let h12 = h % 12; if(h12 === 0) h12 = 12;
    return toArabicDigits(h12) + ':' + toArabicDigits(String(m).padStart(2,'0')) + ' ' + period;
  }

  function render(){
    const total = tasks.length;
    const doneCount = tasks.filter(t => t.done).length;
    const pct = total ? Math.round((doneCount/total)*100) : 0;
    progressFill.style.width = pct + '%';
    progressCount.textContent = toArabicDigits(doneCount) + ' / ' + toArabicDigits(total);

    let visible = tasks;
    if(filter === 'active') visible = tasks.filter(t => !t.done);
    if(filter === 'done') visible = tasks.filter(t => t.done);

    listEl.innerHTML = '';

    if(visible.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      let msg = 'ابدأ يومك بإضافة أول مهمة';
      if(filter === 'active' && total > 0) msg = 'كل المهمات مكتملة، أحسنت';
      if(filter === 'done') msg = 'لا توجد مهمات مكتملة بعد';
      empty.innerHTML = '<span class="mark">✎</span>' + msg;
      listEl.appendChild(empty);
      return;
    }

    const nowStr = new Date().toTimeString().slice(0,5);

    visible.forEach((t, idx) => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      li.style.animationDelay = (idx * 0.04) + 's';

      const box = document.createElement('div');
      box.className = 'checkbox' + (t.done ? ' checked' : '');
      box.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"></polyline></svg>';
      box.addEventListener('click', () => toggleTask(t.id, box));

      const body = document.createElement('div');
      body.className = 'task-body';
      const span = document.createElement('div');
      span.className = 'task-text';
      span.textContent = t.text;
      body.appendChild(span);

      if(t.time){
        const meta = document.createElement('div');
        meta.className = 'task-meta';
        const badge = document.createElement('span');
        badge.className = 'time-badge' + (t.time < nowStr && !t.done ? '' : '');
        badge.textContent = '⏰ ' + fmtTimeBadge(t.time);
        meta.appendChild(badge);
        body.appendChild(meta);
      }

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.innerHTML = '✕';
      del.title = 'حذف';
      del.addEventListener('click', () => deleteTask(t.id, li));

      li.appendChild(box);
      li.appendChild(body);
      li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  /* ---------- Alarm system ---------- */

  function ensureAudioCtx(){
    if(!alarmAudioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      alarmAudioCtx = new Ctx();
    }
    if(alarmAudioCtx.state === 'suspended') alarmAudioCtx.resume();
    return alarmAudioCtx;
  }

  function playBeepPattern(durationMs){
    const ctx = ensureAudioCtx();
    const startTime = ctx.currentTime;
    const beepLen = 0.28;
    const gap = 0.22;
    const cycle = beepLen + gap;
    const count = Math.ceil((durationMs/1000) / cycle);
    activeAlarmNodes = [];
    for(let i=0;i<count;i++){
      const t0 = startTime + i*cycle;
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, t0);
      osc.frequency.setValueAtTime(660, t0 + beepLen/2);
      gainNode.gain.setValueAtTime(0, t0);
      gainNode.gain.linearRampToValueAtTime(0.28, t0 + 0.02);
      gainNode.gain.linearRampToValueAtTime(0, t0 + beepLen);
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + beepLen + 0.02);
      activeAlarmNodes.push({ osc, gainNode });
    }
  }

  function killAllAlarmSound(){
    const ctx = alarmAudioCtx;
    if(ctx){
      const now = ctx.currentTime;
      activeAlarmNodes.forEach(({ osc, gainNode }) => {
        try{
          gainNode.gain.cancelScheduledValues(now);
          gainNode.gain.setValueAtTime(0, now);
          osc.stop(now);
        }catch(e){ /* already stopped */ }
      });
    }
    activeAlarmNodes = [];
  }

  function triggerAlarm(task){
    currentAlarmTaskId = task.id;
    alarmTaskText.textContent = task.text;
    alarmOverlay.classList.add('show');

    try{ playBeepPattern(30000); }catch(e){ console.warn('audio blocked', e); }

    if('vibrate' in navigator){
      const pattern = [];
      for(let i=0;i<15;i++){ pattern.push(280, 220); }
      navigator.vibrate(pattern);
    }

    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification('حان وقت المهمة ⏰', { body: task.text, tag: 'task-' + task.id });
      }catch(e){}
    }

    clearTimeout(alarmTimer);
    alarmTimer = setTimeout(() => stopAlarm(), 30000);
  }

  function stopAlarm(){
    alarmOverlay.classList.remove('show');
    clearTimeout(alarmTimer);
    killAllAlarmSound();
    if('vibrate' in navigator) navigator.vibrate(0);
    currentAlarmTaskId = null;
  }

  alarmStopBtn.addEventListener('click', stopAlarm);
  alarmDoneBtn.addEventListener('click', () => {
    if(currentAlarmTaskId != null){
      const t = tasks.find(t => t.id === currentAlarmTaskId);
      if(t){ t.done = true; render(); }
    }
    stopAlarm();
  });

  function checkDueTasks(){
    const now = new Date();
    const hhmm = now.toTimeString().slice(0,5);
    tasks.forEach(t => {
      if(t.time && !t.done && t.time === hhmm && t.notifiedFor !== hhmm){
        t.notifiedFor = hhmm;
        triggerAlarm(t);
      }
    });
  }
  setInterval(checkDueTasks, 1000);

  /* request notification permission on first interaction */
  function requestNotifPermission(){
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }

  /* ---------- wiring ---------- */

  addBtn.addEventListener('click', (e) => { ripple(e, addBtn); requestNotifPermission(); addTask(inputEl.value); });
  inputEl.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ requestNotifPermission(); addTask(inputEl.value); } });
  clearTimeBtn.addEventListener('click', () => { timeEl.value = ''; });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  spawnAmbient();
  setDate();
  render();
</script>
</body>
</html>
